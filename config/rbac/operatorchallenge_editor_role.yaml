# This rule is not used by the project k8s-operator-challenge itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.teste.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-operator-challenge
    app.kubernetes.io/managed-by: kustomize
  name: operatorchallenge-editor-role
rules:
- apiGroups:
  - apps.teste.com
  resources:
  - operatorchallenges
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.teste.com
  resources:
  - operatorchallenges/status
  verbs:
  - get
